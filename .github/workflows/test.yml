name: test

# Runs on pull requests (never pull_request_target) and pushes to main.
# No secrets are used: `claude plugin validate` needs no login or API key.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: npm test
        run: npm test
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.328
      - name: claude plugin validate
        shell: bash
        run: |
          set -euo pipefail
          claude plugin validate .
          for d in plugins/*/; do
            echo "== $d"
            claude plugin validate "$d"
          done
